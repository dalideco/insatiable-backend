        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          version: 3.2.0

      - name: Run tests
        run: bin/rails test:all

      # Step: Sleep for 2 minutes
      - name: Sleep for 2 minutes
        run: sleep 120
